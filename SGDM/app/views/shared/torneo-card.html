<article class="torneo-card"

  <div class="torneo-card__body">

    <!-- Etiquetas: deporte + sistema + estado -->

      <span class="badge badge-muted">Fútbol</span>
      <span class="badge badge-muted">Liga</span>
      <span class="status-live">En curso</span>

  </div>

  <div class="torneo-card__footer">
    <span style="font-family:var(--mono);font-size:12px;color:var(--muted)">Ronda 4 de 11</span>
    <a class="btn btn-primary btn-sm" href="/pages/torneo-detalle.html?id=1">Ver torneo</a>
  </div>

</article>
