<!-- Modal: Confirmar acción -->
<div class="modal" id="modal-confirm" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
  <div class="modal__box">
    <button class="modal__close" data-modal-close aria-label="Cerrar">✕</button>
    <h2 class="modal__title" id="modal-confirm-title">Confirmar acción</h2>
    <p style="color:var(--muted);font-size:var(--font-size-sm);margin-bottom:var(--space-5)">
      ¿Estás seguro de que deseas realizar esta acción? No se puede deshacer.
    </p>
    <div style="display:flex;gap:var(--space-3);justify-content:flex-end">
      <button class="btn btn-ghost" data-modal-close>Cancelar</button>
      <button class="btn btn-primary" id="modal-confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<!-- Modal: Crear / Editar torneo rápido -->
<div class="modal" id="modal-torneo" role="dialog" aria-modal="true" aria-labelledby="modal-torneo-title">
  <div class="modal__box" style="max-width:600px">
    <button class="modal__close" data-modal-close aria-label="Cerrar">✕</button>
    <h2 class="modal__title" id="modal-torneo-title">Nuevo torneo</h2>

    <form id="formTorneoModal" novalidate>
      <div class="form-grid">
        <div class="form-group full">
          <label class="form-label" for="modal-nombre">Nombre del torneo *</label>
          <input class="form-control" type="text" id="modal-nombre" name="nombre"
                 placeholder="Ej: Copa Primavera 2026" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="modal-deporte">Deporte / Disciplina *</label>
          <select class="form-control" id="modal-deporte" name="deporte" required>
            <option value="">Seleccionar...</option>
            <option value="futbol">Fútbol</option>
            <option value="basquet">Básquetbol</option>
            <option value="tenis">Tenis</option>
            <option value="ajedrez">Ajedrez</option>
            <option value="esports">Esports</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="modal-sistema">Sistema de juego *</label>
          <select class="form-control" id="modal-sistema" name="sistema" required>
            <option value="">Seleccionar...</option>
            <option value="liga">Liga (todos contra todos)</option>
            <option value="eliminacion">Eliminación directa</option>
            <option value="suizo">Sistema suizo</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="modal-inicio">Fecha de inicio *</label>
          <input class="form-control" type="date" id="modal-inicio" name="fecha_inicio" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="modal-max">Máximo de equipos</label>
          <input class="form-control" type="number" id="modal-max" name="max_equipos"
                 min="2" max="256" placeholder="16">
        </div>
      </div>

      <div style="display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-5)">
        <button type="button" class="btn btn-ghost" data-modal-close>Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear torneo</button>
      </div>
    </form>
  </div>
</div>
